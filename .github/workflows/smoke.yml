name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out S0_multi compatibility pin
        uses: actions/checkout@v4
        with:
          repository: ChengUCB/S0_multi
          ref: db703fabf2aac05f38e821b1113b47fe46313089
          path: companion/S0_multi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned smoke dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Run repository smoke tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
        env:
          SZERO_DIR: ${{ github.workspace }}/companion/S0_multi
